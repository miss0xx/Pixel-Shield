<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="48%" r="70%">
      <stop offset="0%" stop-color="#0E1530"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </radialGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6C5CE7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow3-sm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes pulse3 { 0%,100%{opacity:.25} 50%{opacity:.5} }
      @keyframes data-flow { 0%{stroke-dashoffset:60} 100%{stroke-dashoffset:0} }
      @keyframes node-pulse { 0%,100%{r:22;opacity:.3} 50%{r:28;opacity:.1} }
      @keyframes rotate3 { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      .p3 { animation: pulse3 2s ease-in-out infinite; }
      .flow { animation: data-flow 2s linear infinite; }
      .flow2 { animation: data-flow 2.5s linear infinite; }
      .flow3 { animation: data-flow 3s linear infinite; }
      .rot3 { animation: rotate3 20s linear infinite; transform-origin: 400px 300px; }
    </style>
    <linearGradient id="node-pc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2848"/>
      <stop offset="100%" stop-color="#12182B"/>
    </linearGradient>
    <linearGradient id="center-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2450"/>
      <stop offset="100%" stop-color="#0E1830"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg3)"/>

  <!-- Grid -->
  <g opacity="0.05" stroke="#00D4FF" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/><line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="525" x2="800" y2="525"/>
    <line x1="80" y1="0" x2="80" y2="600"/><line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="240" y1="0" x2="240" y2="600"/><line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/><line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="560" y1="0" x2="560" y2="600"/><line x1="640" y1="0" x2="640" y2="600"/>
    <line x1="720" y1="0" x2="720" y2="600"/>
  </g>

  <!-- Protection dome (ellipse) -->
  <ellipse cx="400" cy="300" rx="330" ry="220" fill="none" stroke="#00D4FF" stroke-width="1.5"
           stroke-dasharray="10 8" opacity="0.25" class="rot3"/>
  <ellipse cx="400" cy="300" rx="310" ry="205" fill="none" stroke="#6C5CE7" stroke-width="1"
           opacity="0.15"/>
  <ellipse cx="400" cy="300" rx="300" ry="196" fill="#00D4FF" opacity="0.03"/>

  <!-- Center glow -->
  <ellipse cx="400" cy="300" rx="160" ry="120" fill="url(#center-glow)" class="p3"/>

  <!-- === CONNECTION LINES === -->
  <!-- Center to PC Top-Left -->
  <line x1="400" y1="300" x2="175" y2="165" stroke="#00D4FF" stroke-width="1.5"
        stroke-dasharray="8 5" class="flow" opacity="0.6"/>
  <!-- Center to Server Top -->
  <line x1="400" y1="300" x2="400" y2="120" stroke="#6C5CE7" stroke-width="1.5"
        stroke-dasharray="8 5" class="flow2" opacity="0.6"/>
  <!-- Center to PC Top-Right -->
  <line x1="400" y1="300" x2="625" y2="165" stroke="#00D4FF" stroke-width="1.5"
        stroke-dasharray="8 5" class="flow" opacity="0.6"/>
  <!-- Center to Mobile Left -->
  <line x1="400" y1="300" x2="115" y2="310" stroke="#6C5CE7" stroke-width="1.5"
        stroke-dasharray="8 5" class="flow3" opacity="0.6"/>
  <!-- Center to Mobile Right -->
  <line x1="400" y1="300" x2="685" y2="310" stroke="#6C5CE7" stroke-width="1.5"
        stroke-dasharray="8 5" class="flow3" opacity="0.6"/>
  <!-- Center to PC Bottom-Left -->
  <line x1="400" y1="300" x2="175" y2="435" stroke="#00D4FF" stroke-width="1.5"
        stroke-dasharray="8 5" class="flow2" opacity="0.6"/>
  <!-- Center to Server Bottom -->
  <line x1="400" y1="300" x2="400" y2="460" stroke="#6C5CE7" stroke-width="1.5"
        stroke-dasharray="8 5" class="flow" opacity="0.6"/>
  <!-- Center to PC Bottom-Right -->
  <line x1="400" y1="300" x2="625" y2="435" stroke="#00D4FF" stroke-width="1.5"
        stroke-dasharray="8 5" class="flow2" opacity="0.6"/>

  <!-- Data packets on lines (dots) -->
  <g filter="url(#glow3-sm)">
    <circle cx="288" cy="232" r="4" fill="#00D4FF" opacity="0.9"/>
    <circle cx="400" cy="210" r="4" fill="#6C5CE7" opacity="0.9"/>
    <circle cx="512" cy="232" r="4" fill="#00D4FF" opacity="0.9"/>
    <circle cx="257" cy="305" r="4" fill="#6C5CE7" opacity="0.9"/>
    <circle cx="542" cy="305" r="4" fill="#6C5CE7" opacity="0.9"/>
    <circle cx="288" cy="368" r="4" fill="#00D4FF" opacity="0.9"/>
    <circle cx="400" cy="380" r="4" fill="#6C5CE7" opacity="0.9"/>
    <circle cx="512" cy="368" r="4" fill="#00D4FF" opacity="0.9"/>
  </g>

  <!-- === CENTER NODE - PIXEL SHIELD HUB === -->
  <circle cx="400" cy="300" r="48" fill="url(#center-node)" stroke="#00D4FF" stroke-width="2" filter="url(#glow3)"/>
  <circle cx="400" cy="300" r="38" fill="none" stroke="#6C5CE7" stroke-width="1" opacity="0.6"/>
  <!-- Shield icon in center -->
  <path d="M400,272 L418,280 L418,302 Q418,320 400,330 Q382,320 382,302 L382,280 Z"
        fill="#6C5CE7" opacity="0.6" stroke="#00D4FF" stroke-width="1.5"/>
  <polyline points="391,302 398,310 412,292" fill="none" stroke="#E6F1FF" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="345" fill="#00D4FF" font-size="8" text-anchor="middle" opacity="0.9">HUB CENTRAL</text>

  <!-- === DEVICE NODES === -->
  <!-- PC Top-Left -->
  <g filter="url(#glow3-sm)">
    <rect x="138" y="132" width="74" height="66" rx="7" fill="url(#node-pc)" stroke="#00D4FF" stroke-width="1.5"/>
    <rect x="145" y="139" width="60" height="42" rx="4" fill="#090D1A" stroke="#1E2848" stroke-width="1"/>
    <!-- Mini screen content -->
    <rect x="149" y="143" width="52" height="34" rx="2" fill="#0D1220"/>
    <line x1="152" y1="150" x2="198" y2="150" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>
    <line x1="152" y1="156" x2="190" y2="156" stroke="#6C5CE7" stroke-width="1" opacity="0.5"/>
    <line x1="152" y1="162" x2="195" y2="162" stroke="#00D4FF" stroke-width="1" opacity="0.4"/>
    <line x1="152" y1="168" x2="185" y2="168" stroke="#E6F1FF" stroke-width="1" opacity="0.3"/>
    <!-- Stand -->
    <rect x="168" y="181" width="14" height="8" rx="1" fill="#12182B"/>
    <rect x="158" y="188" width="34" height="5" rx="2" fill="#12182B"/>
    <!-- Label -->
    <text x="175" y="207" fill="#00D4FF" font-size="9" text-anchor="middle" opacity="0.8">WORKSTATION</text>
    <circle cx="205" cy="132" r="5" fill="#00CC44" filter="url(#glow3-sm)"/>
  </g>

  <!-- Server Top -->
  <g filter="url(#glow3-sm)" transform="translate(370,80)">
    <rect x="0" y="0" width="60" height="72" rx="5" fill="url(#node-pc)" stroke="#6C5CE7" stroke-width="1.5"/>
    <rect x="6" y="8" width="48" height="10" rx="2" fill="#090D1A" stroke="#1E2848" stroke-width="0.8"/>
    <circle cx="14" cy="13" r="2.5" fill="#00CC44"/>
    <line x1="20" y1="13" x2="50" y2="13" stroke="#E6F1FF" stroke-width="1" opacity="0.4"/>
    <rect x="6" y="22" width="48" height="10" rx="2" fill="#090D1A" stroke="#1E2848" stroke-width="0.8"/>
    <circle cx="14" cy="27" r="2.5" fill="#00CC44"/>
    <line x1="20" y1="27" x2="50" y2="27" stroke="#E6F1FF" stroke-width="1" opacity="0.4"/>
    <rect x="6" y="36" width="48" height="10" rx="2" fill="#090D1A" stroke="#1E2848" stroke-width="0.8"/>
    <circle cx="14" cy="41" r="2.5" fill="#FFAA00"/>
    <line x1="20" y1="41" x2="44" y2="41" stroke="#E6F1FF" stroke-width="1" opacity="0.3"/>
    <rect x="6" y="50" width="48" height="10" rx="2" fill="#090D1A" stroke="#1E2848" stroke-width="0.8"/>
    <circle cx="14" cy="55" r="2.5" fill="#00CC44"/>
    <line x1="20" y1="55" x2="48" y2="55" stroke="#E6F1FF" stroke-width="1" opacity="0.4"/>
    <text x="30" y="83" fill="#6C5CE7" font-size="9" text-anchor="middle" opacity="0.9">SERVER</text>
  </g>

  <!-- PC Top-Right -->
  <g filter="url(#glow3-sm)">
    <rect x="588" y="132" width="74" height="66" rx="7" fill="url(#node-pc)" stroke="#00D4FF" stroke-width="1.5"/>
    <rect x="595" y="139" width="60" height="42" rx="4" fill="#090D1A" stroke="#1E2848" stroke-width="1"/>
    <rect x="599" y="143" width="52" height="34" rx="2" fill="#0D1220"/>
    <line x1="602" y1="150" x2="648" y2="150" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>
    <line x1="602" y1="156" x2="640" y2="156" stroke="#6C5CE7" stroke-width="1" opacity="0.5"/>
    <line x1="602" y1="162" x2="645" y2="162" stroke="#00D4FF" stroke-width="1" opacity="0.4"/>
    <line x1="602" y1="168" x2="636" y2="168" stroke="#E6F1FF" stroke-width="1" opacity="0.3"/>
    <rect x="618" y="181" width="14" height="8" rx="1" fill="#12182B"/>
    <rect x="608" y="188" width="34" height="5" rx="2" fill="#12182B"/>
    <text x="625" y="207" fill="#00D4FF" font-size="9" text-anchor="middle" opacity="0.8">WORKSTATION</text>
    <circle cx="595" cy="132" r="5" fill="#00CC44" filter="url(#glow3-sm)"/>
  </g>

  <!-- Mobile Left -->
  <g filter="url(#glow3-sm)" transform="translate(80,274)">
    <rect x="0" y="0" width="36" height="62" rx="7" fill="url(#node-pc)" stroke="#6C5CE7" stroke-width="1.5"/>
    <rect x="4" y="7" width="28" height="44" rx="3" fill="#090D1A" stroke="#1E2848" stroke-width="0.8"/>
    <circle cx="18" cy="57" r="3" fill="none" stroke="#6C5CE7" stroke-width="1.2"/>
    <!-- Mini screen bars -->
    <rect x="7" y="10" width="22" height="3" rx="1" fill="#6C5CE7" opacity="0.6"/>
    <rect x="7" y="16" width="18" height="2" rx="1" fill="#00D4FF" opacity="0.5"/>
    <rect x="7" y="21" width="20" height="2" rx="1" fill="#E6F1FF" opacity="0.3"/>
    <rect x="7" y="30" width="8" height="12" rx="1" fill="#6C5CE7" opacity="0.5"/>
    <rect x="18" y="30" width="11" height="6" rx="1" fill="#00D4FF" opacity="0.4"/>
    <rect x="18" y="39" width="11" height="3" rx="1" fill="#6C5CE7" opacity="0.3"/>
    <text x="18" y="78" fill="#6C5CE7" font-size="8" text-anchor="middle" opacity="0.8">MOBILE</text>
  </g>

  <!-- Mobile Right -->
  <g filter="url(#glow3-sm)" transform="translate(684,274)">
    <rect x="0" y="0" width="36" height="62" rx="7" fill="url(#node-pc)" stroke="#6C5CE7" stroke-width="1.5"/>
    <rect x="4" y="7" width="28" height="44" rx="3" fill="#090D1A" stroke="#1E2848" stroke-width="0.8"/>
    <circle cx="18" cy="57" r="3" fill="none" stroke="#6C5CE7" stroke-width="1.2"/>
    <rect x="7" y="10" width="22" height="3" rx="1" fill="#6C5CE7" opacity="0.6"/>
    <rect x="7" y="16" width="18" height="2" rx="1" fill="#00D4FF" opacity="0.5"/>
    <rect x="7" y="21" width="20" height="2" rx="1" fill="#E6F1FF" opacity="0.3"/>
    <rect x="7" y="30" width="8" height="12" rx="1" fill="#6C5CE7" opacity="0.5"/>
    <rect x="18" y="30" width="11" height="6" rx="1" fill="#00D4FF" opacity="0.4"/>
    <rect x="18" y="39" width="11" height="3" rx="1" fill="#6C5CE7" opacity="0.3"/>
    <text x="18" y="78" fill="#6C5CE7" font-size="8" text-anchor="middle" opacity="0.8">MOBILE</text>
  </g>

  <!-- PC Bottom-Left -->
  <g filter="url(#glow3-sm)">
    <rect x="138" y="400" width="74" height="66" rx="7" fill="url(#node-pc)" stroke="#00D4FF" stroke-width="1.5"/>
    <rect x="145" y="407" width="60" height="42" rx="4" fill="#090D1A"/>
    <rect x="149" y="411" width="52" height="34" rx="2" fill="#0D1220"/>
    <line x1="152" y1="418" x2="198" y2="418" stroke="#00D4FF" stroke-width="1" opacity="0.5"/>
    <line x1="152" y1="424" x2="188" y2="424" stroke="#6C5CE7" stroke-width="1" opacity="0.4"/>
    <line x1="152" y1="430" x2="194" y2="430" stroke="#00D4FF" stroke-width="1" opacity="0.35"/>
    <line x1="152" y1="436" x2="182" y2="436" stroke="#E6F1FF" stroke-width="1" opacity="0.25"/>
    <rect x="168" y="449" width="14" height="8" rx="1" fill="#12182B"/>
    <rect x="158" y="456" width="34" height="5" rx="2" fill="#12182B"/>
    <text x="175" y="475" fill="#00D4FF" font-size="9" text-anchor="middle" opacity="0.8">LAPTOP</text>
    <circle cx="205" cy="400" r="5" fill="#00CC44" filter="url(#glow3-sm)"/>
  </g>

  <!-- NAS/Server Bottom -->
  <g filter="url(#glow3-sm)" transform="translate(368,445)">
    <rect x="0" y="0" width="64" height="38" rx="5" fill="url(#node-pc)" stroke="#6C5CE7" stroke-width="1.5"/>
    <rect x="6" y="6" width="52" height="8" rx="2" fill="#090D1A" stroke="#1E2848" stroke-width="0.8"/>
    <circle cx="14" cy="10" r="2" fill="#00CC44"/>
    <rect x="20" y="8" width="30" height="4" rx="1" fill="#1E2848"/>
    <rect x="6" y="17" width="52" height="8" rx="2" fill="#090D1A" stroke="#1E2848" stroke-width="0.8"/>
    <circle cx="14" cy="21" r="2" fill="#00CC44"/>
    <rect x="20" y="19" width="28" height="4" rx="1" fill="#1E2848"/>
    <rect x="6" y="28" width="52" height="5" rx="2" fill="#090D1A" stroke="#1E2848" stroke-width="0.8"/>
    <text x="32" y="52" fill="#6C5CE7" font-size="9" text-anchor="middle" opacity="0.9">NAS STORAGE</text>
  </g>

  <!-- PC Bottom-Right -->
  <g filter="url(#glow3-sm)">
    <rect x="588" y="400" width="74" height="66" rx="7" fill="url(#node-pc)" stroke="#00D4FF" stroke-width="1.5"/>
    <rect x="595" y="407" width="60" height="42" rx="4" fill="#090D1A"/>
    <rect x="599" y="411" width="52" height="34" rx="2" fill="#0D1220"/>
    <line x1="602" y1="418" x2="648" y2="418" stroke="#00D4FF" stroke-width="1" opacity="0.5"/>
    <line x1="602" y1="424" x2="638" y2="424" stroke="#6C5CE7" stroke-width="1" opacity="0.4"/>
    <line x1="602" y1="430" x2="645" y2="430" stroke="#00D4FF" stroke-width="1" opacity="0.35"/>
    <line x1="602" y1="436" x2="633" y2="436" stroke="#E6F1FF" stroke-width="1" opacity="0.25"/>
    <rect x="618" y="449" width="14" height="8" rx="1" fill="#12182B"/>
    <rect x="608" y="456" width="34" height="5" rx="2" fill="#12182B"/>
    <text x="625" y="475" fill="#00D4FF" font-size="9" text-anchor="middle" opacity="0.8">LAPTOP</text>
    <circle cx="595" cy="400" r="5" fill="#00CC44" filter="url(#glow3-sm)"/>
  </g>

  <!-- Stats bubbles on connections -->
  <g font-size="8" fill="#E6F1FF" opacity="0.55">
    <rect x="248" y="216" width="58" height="14" rx="3" fill="#12182B" stroke="#00D4FF" stroke-width="0.8"/>
    <text x="277" y="226" text-anchor="middle">128-bit AES</text>
    <rect x="494" y="216" width="58" height="14" rx="3" fill="#12182B" stroke="#00D4FF" stroke-width="0.8"/>
    <text x="523" y="226" text-anchor="middle">TLS 1.3</text>
    <rect x="248" y="365" width="58" height="14" rx="3" fill="#12182B" stroke="#6C5CE7" stroke-width="0.8"/>
    <text x="277" y="375" text-anchor="middle">SECURED</text>
    <rect x="494" y="365" width="58" height="14" rx="3" fill="#12182B" stroke="#6C5CE7" stroke-width="0.8"/>
    <text x="523" y="375" text-anchor="middle">SECURED</text>
  </g>

  <!-- Bottom message -->
  <rect x="0" y="560" width="800" height="40" fill="#0B0F1A" opacity="0.9"/>
  <rect x="0" y="560" width="800" height="1.5" fill="#00D4FF" opacity="0.5"/>
  <text x="400" y="580" fill="#E6F1FF" font-size="11" text-anchor="middle" opacity="0.8">Protection de tout un système — Pixel Shield Business Shield</text>

  <!-- Title -->
  <rect x="0" y="0" width="800" height="58" fill="#0B0F1A" opacity="0.75"/>
  <rect x="0" y="57" width="800" height="1.5" fill="#00D4FF" opacity="0.45"/>
  <text x="400" y="30" fill="#E6F1FF" font-size="24" text-anchor="middle" font-weight="bold" filter="url(#glow3)">◈ RÉSEAU CONNECTÉ</text>
  <text x="400" y="50" fill="#00D4FF" font-size="10" text-anchor="middle" opacity="0.8">BUSINESS SHIELD™ — 8 APPAREILS PROTÉGÉS  ·  RÉSEAU SÉCURISÉ</text>

  <!-- Corner marks -->
  <g stroke="#00D4FF" stroke-width="1.5" fill="none" opacity="0.35">
    <path d="M10,10 L10,26 M10,10 L26,10"/><path d="M790,10 L790,26 M790,10 L774,10"/>
    <path d="M10,590 L10,574 M10,590 L26,590"/><path d="M790,590 L790,574 M790,590 L774,590"/>
  </g>
</svg>
