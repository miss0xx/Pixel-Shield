<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" width="400" height="200">
  <defs>
    <linearGradient id="aenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1F2E"/>
      <stop offset="100%" style="stop-color:#131720"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93C5FD"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6F1FF"/>
      <stop offset="100%" style="stop-color:#BFDBFE"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" fill="url(#aenBg)" rx="4"/>

  <!-- Constellation dots -->
  <g opacity="0.3" fill="#93C5FD">
    <circle cx="60" cy="25" r="1"/>
    <circle cx="100" cy="40" r="0.8"/>
    <circle cx="310" cy="22" r="1"/>
    <circle cx="350" cy="45" r="0.8"/>
    <circle cx="45" cy="170" r="0.8"/>
    <circle cx="355" cy="165" r="1"/>
  </g>
  <g opacity="0.1" stroke="#93C5FD" stroke-width="0.5">
    <line x1="60" y1="25" x2="100" y2="40"/>
    <line x1="310" y1="22" x2="350" y2="45"/>
  </g>

  <!-- Book base -->
  <rect x="157" y="64" width="56" height="44" rx="2" fill="url(#bookGrad)" opacity="0.9"/>
  <!-- Book spine -->
  <rect x="157" y="64" width="6" height="44" rx="2" fill="#3B82F6" opacity="0.7"/>
  <!-- Book pages lines -->
  <line x1="168" y1="72" x2="207" y2="72" stroke="#3B82F6" stroke-width="1" opacity="0.4"/>
  <line x1="168" y1="80" x2="207" y2="80" stroke="#3B82F6" stroke-width="1" opacity="0.4"/>
  <line x1="168" y1="88" x2="207" y2="88" stroke="#3B82F6" stroke-width="1" opacity="0.4"/>
  <line x1="168" y1="96" x2="195" y2="96" stroke="#3B82F6" stroke-width="1" opacity="0.4"/>

  <!-- Star fused above book -->
  <!-- 5-pointed star centered at 185, 52 -->
  <polygon points="185,34 188.8,46 201,46 191.1,53.6 194.9,65.6 185,58 175.1,65.6 178.9,53.6 169,46 181.2,46" fill="url(#starGrad)"/>

  <!-- Glow around star -->
  <circle cx="185" cy="50" r="22" fill="#3B82F6" opacity="0.08"/>

  <!-- Brand name -->
  <text x="200" y="148" font-family="'Cinzel', 'Palatino Linotype', 'Book Antiqua', serif"
        font-size="17" font-weight="700" fill="#E6F1FF" text-anchor="middle" letter-spacing="4">ASTRA</text>
  <text x="200" y="163" font-family="'Cinzel', 'Palatino Linotype', serif"
        font-size="8.5" font-weight="400" fill="#3B82F6" text-anchor="middle" letter-spacing="3.5">EDUCATION NETWORK</text>
</svg>
