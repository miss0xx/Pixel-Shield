<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" width="400" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5E27A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8922A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111" />
      <stop offset="100%" style="stop-color:#1a1a1a" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" fill="url(#bgGrad)" rx="4"/>
  <!-- Decorative thin border -->
  <rect x="12" y="12" width="376" height="176" fill="none" stroke="#D4AF37" stroke-width="0.5" rx="2" opacity="0.5"/>

  <!-- V Symbol: two diagonal strokes forming elegant V -->
  <line x1="155" y1="45" x2="185" y2="105" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="215" y1="45" x2="185" y2="105" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Thin inner V -->
  <line x1="163" y1="45" x2="185" y2="95" stroke="#F5E27A" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <line x1="207" y1="45" x2="185" y2="95" stroke="#F5E27A" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <!-- Horizontal accent line under V -->
  <line x1="148" y1="112" x2="222" y2="112" stroke="#D4AF37" stroke-width="0.6" opacity="0.7"/>

  <!-- Brand name -->
  <text x="200" y="142" font-family="'Didact Gothic', 'Cormorant Garamond', 'Palatino Linotype', serif"
        font-size="22" font-weight="300" fill="#F5F5F5" text-anchor="middle" letter-spacing="10">VELORA</text>
  <!-- Subtitle -->
  <text x="200" y="163" font-family="'Didact Gothic', 'Cormorant Garamond', 'Palatino Linotype', serif"
        font-size="9" font-weight="300" fill="#D4AF37" text-anchor="middle" letter-spacing="6">FASHION GROUP</text>
</svg>
