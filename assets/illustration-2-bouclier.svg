<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#12182B"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </radialGradient>
    <radialGradient id="shield-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00D4FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#4A3DB5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6C5CE7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-v" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-b" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes rotate-ring { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes rotate-ring2 { from{transform:rotate(0deg)} to{transform:rotate(-360deg)} }
      @keyframes pulse-shield { 0%,100%{opacity:.5;r:105} 50%{opacity:.15;r:120} }
      @keyframes float-pixel { 0%{transform:translate(0,0);opacity:.8} 50%{transform:translate(4px,-8px);opacity:.5} 100%{transform:translate(-4px,0);opacity:.8} }
      @keyframes pulse-aura { 0%,100%{opacity:.2} 50%{opacity:.4} }
      @keyframes spin-hex { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes checkmark { 0%{stroke-dashoffset:50} 100%{stroke-dashoffset:0} }
      .ring1 { animation: rotate-ring 12s linear infinite; transform-origin: 400px 295px; }
      .ring2 { animation: rotate-ring2 18s linear infinite; transform-origin: 400px 295px; }
      .aura-pulse { animation: pulse-aura 2.5s ease-in-out infinite; }
    </style>
    <linearGradient id="shield-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="comp-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2140"/>
      <stop offset="100%" stop-color="#12182B"/>
    </linearGradient>
    <linearGradient id="screen-grad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1225"/>
      <stop offset="100%" stop-color="#090D1A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg2)"/>

  <!-- Hex grid background -->
  <g opacity="0.05" stroke="#6C5CE7" stroke-width="0.6" fill="none">
    <polygon points="400,60 434,80 434,120 400,140 366,120 366,80"/><polygon points="434,80 468,100 468,140 434,160 400,140 400,100"/>
    <polygon points="366,80 400,100 400,140 366,160 332,140 332,100"/><polygon points="434,160 468,180 468,220 434,240 400,220 400,180"/>
    <polygon points="366,160 400,180 400,220 366,240 332,220 332,180"/><polygon points="300,80 334,100 334,140 300,160 266,140 266,100"/>
    <polygon points="468,80 502,100 502,140 468,160 434,140 434,100"/><polygon points="500,160 534,180 534,220 500,240 466,220 466,180"/>
    <polygon points="300,160 334,180 334,220 300,240 266,220 266,180"/><polygon points="400,460 434,480 434,520 400,540 366,520 366,480"/>
    <polygon points="266,260 300,280 300,320 266,340 232,320 232,280"/><polygon points="534,260 568,280 568,320 534,340 500,320 500,280"/>
    <polygon points="434,480 468,500 468,540 434,560 400,540 400,500"/><polygon points="366,480 400,500 400,540 366,560 332,540 332,500"/>
  </g>

  <!-- Shield aura -->
  <circle cx="400" cy="295" r="175" fill="url(#shield-glow)" class="aura-pulse"/>
  <circle cx="400" cy="295" r="130" fill="none" stroke="#6C5CE7" stroke-width="0.5" opacity="0.3" class="aura-pulse"/>

  <!-- Rotating ring 1 -->
  <g class="ring1">
    <circle cx="400" cy="295" r="148" fill="none" stroke="#6C5CE7" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.5"/>
    <!-- Small dots on ring -->
    <circle cx="400" cy="147" r="3.5" fill="#6C5CE7" opacity="0.8"/>
    <circle cx="548" cy="295" r="3.5" fill="#6C5CE7" opacity="0.8"/>
    <circle cx="400" cy="443" r="3.5" fill="#6C5CE7" opacity="0.8"/>
    <circle cx="252" cy="295" r="3.5" fill="#6C5CE7" opacity="0.8"/>
  </g>

  <!-- Rotating ring 2 -->
  <g class="ring2">
    <circle cx="400" cy="295" r="168" fill="none" stroke="#00D4FF" stroke-width="1" stroke-dasharray="4 20" opacity="0.4"/>
    <circle cx="400" cy="127" r="4" fill="#00D4FF" opacity="0.7"/>
    <circle cx="568" cy="295" r="4" fill="#00D4FF" opacity="0.7"/>
    <circle cx="400" cy="463" r="4" fill="#00D4FF" opacity="0.7"/>
    <circle cx="232" cy="295" r="4" fill="#00D4FF" opacity="0.7"/>
  </g>

  <!-- Shield shape -->
  <path d="M400,165 L470,195 L470,280 Q470,340 400,380 Q330,340 330,280 L330,195 Z"
        fill="url(#shield-fill)" stroke="#6C5CE7" stroke-width="2.5" filter="url(#glow-v)"/>
  <!-- Shield inner highlight -->
  <path d="M400,178 L458,204 L458,278 Q458,330 400,366 Q342,330 342,278 L342,204 Z"
        fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.5"/>
  <!-- Shield inner glow -->
  <path d="M400,190 L448,212 L448,276 Q448,322 400,355 Q352,322 352,276 L352,212 Z"
        fill="#6C5CE7" opacity="0.1"/>

  <!-- Shield center symbol - Pixel "P" or checkmark -->
  <g filter="url(#glow-b)">
    <!-- Checkmark -->
    <polyline points="375,278 393,298 428,255" fill="none" stroke="#E6F1FF" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="50" stroke-dashoffset="0"/>
    <!-- Center dot -->
    <circle cx="400" cy="295" r="3" fill="#00D4FF" opacity="0.8"/>
  </g>

  <!-- Pixel particles flowing toward shield -->
  <g filter="url(#glow-sm2)" opacity="0.9">
    <!-- Left particles -->
    <rect x="188" y="260" width="6" height="6" fill="#6C5CE7" rx="1"/><rect x="202" y="248" width="5" height="5" fill="#00D4FF" rx="1"/>
    <rect x="214" y="270" width="4" height="4" fill="#6C5CE7" rx="1"/><rect x="226" y="255" width="7" height="7" fill="#E6F1FF" rx="1" opacity="0.5"/>
    <rect x="166" y="285" width="5" height="5" fill="#00D4FF" rx="1"/><rect x="178" y="300" width="4" height="4" fill="#6C5CE7" rx="1"/>
    <!-- Right particles -->
    <rect x="606" y="260" width="6" height="6" fill="#6C5CE7" rx="1"/><rect x="593" y="248" width="5" height="5" fill="#00D4FF" rx="1"/>
    <rect x="580" y="272" width="4" height="4" fill="#6C5CE7" rx="1"/><rect x="568" y="256" width="7" height="7" fill="#E6F1FF" rx="1" opacity="0.5"/>
    <rect x="628" y="285" width="5" height="5" fill="#00D4FF" rx="1"/><rect x="616" y="300" width="4" height="4" fill="#6C5CE7" rx="1"/>
    <!-- Top particles -->
    <rect x="362" y="100" width="5" height="5" fill="#6C5CE7" rx="1"/><rect x="378" y="116" width="4" height="4" fill="#00D4FF" rx="1"/>
    <rect x="394" y="100" width="6" height="6" fill="#E6F1FF" rx="1" opacity="0.6"/><rect x="412" y="108" width="4" height="4" fill="#6C5CE7" rx="1"/>
    <rect x="426" y="118" width="5" height="5" fill="#00D4FF" rx="1"/>
    <!-- Trailing lines from particles -->
    <line x1="193" y1="263" x2="248" y2="268" stroke="#6C5CE7" stroke-width="1" opacity="0.3"/>
    <line x1="605" y1="263" x2="552" y2="268" stroke="#00D4FF" stroke-width="1" opacity="0.3"/>
    <line x1="396" y1="105" x2="396" y2="155" stroke="#6C5CE7" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Computer below shield -->
  <!-- Screen body -->
  <rect x="312" y="398" width="176" height="120" rx="8" fill="url(#comp-grad)" stroke="#2A3560" stroke-width="1.5"/>
  <rect x="320" y="406" width="160" height="104" rx="5" fill="url(#screen-grad2)" stroke="#1E2848" stroke-width="1"/>
  <!-- Screen content - PROTECTED status -->
  <rect x="328" y="414" width="144" height="20" rx="3" fill="#0a1020"/>
  <circle cx="340" cy="424" r="4" fill="#00CC44"/>
  <text x="350" y="428" fill="#00CC44" font-size="9">PROTECTED</text>
  <text x="440" y="428" fill="#E6F1FF" font-size="8" opacity="0.5">v3.2.1</text>
  <!-- Mini chart bars -->
  <rect x="330" y="445" width="8" height="14" fill="#6C5CE7" rx="1" opacity="0.7"/>
  <rect x="342" y="440" width="8" height="19" fill="#6C5CE7" rx="1" opacity="0.8"/>
  <rect x="354" y="443" width="8" height="16" fill="#00D4FF" rx="1" opacity="0.7"/>
  <rect x="366" y="438" width="8" height="21" fill="#6C5CE7" rx="1"/>
  <rect x="378" y="441" width="8" height="18" fill="#00D4FF" rx="1" opacity="0.8"/>
  <rect x="390" y="444" width="8" height="15" fill="#6C5CE7" rx="1" opacity="0.7"/>
  <rect x="402" y="439" width="8" height="20" fill="#00D4FF" rx="1"/>
  <rect x="414" y="442" width="8" height="17" fill="#6C5CE7" rx="1" opacity="0.8"/>
  <rect x="426" y="445" width="8" height="14" fill="#00D4FF" rx="1" opacity="0.6"/>
  <rect x="438" y="440" width="8" height="19" fill="#6C5CE7" rx="1" opacity="0.7"/>
  <!-- Status line -->
  <line x1="328" y1="472" x2="464" y2="472" stroke="#1E2848" stroke-width="1"/>
  <text x="330" y="484" fill="#6C5CE7" font-size="8">THREATS BLOCKED: 1,247</text>
  <text x="330" y="495" fill="#00D4FF" font-size="8">UPTIME: 99.97%  |  SECURE</text>
  <!-- Screen glow -->
  <rect x="320" y="406" width="160" height="104" rx="5" fill="#6C5CE7" opacity="0.04"/>
  <!-- Monitor stand -->
  <rect x="392" y="518" width="16" height="16" rx="2" fill="#12182B"/>
  <rect x="370" y="532" width="60" height="9" rx="4" fill="#12182B" stroke="#1E2848" stroke-width="1"/>

  <!-- Protection beam - shield to computer -->
  <line x1="370" y1="380" x2="360" y2="406" stroke="#6C5CE7" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 4"/>
  <line x1="430" y1="380" x2="440" y2="406" stroke="#6C5CE7" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 4"/>

  <!-- Threat arrows being deflected -->
  <g filter="url(#glow-sm2)" opacity="0.7">
    <!-- Left threat deflected -->
    <line x1="120" y1="240" x2="310" y2="275" stroke="#FF4444" stroke-width="1.5" stroke-dasharray="5 3"/>
    <polygon points="312,270 296,264 305,280" fill="#FF4444" opacity="0.6"/>
    <!-- Deflection spark -->
    <circle cx="332" cy="278" r="5" fill="#FF4444" opacity="0.3"/>
    <line x1="325" y1="270" x2="318" y2="258" stroke="#FF4444" stroke-width="1.5" opacity="0.5"/>
    <line x1="330" y1="270" x2="335" y2="255" stroke="#FF4444" stroke-width="1.5" opacity="0.5"/>
    <!-- Right threat deflected -->
    <line x1="680" y1="240" x2="490" y2="275" stroke="#FF4444" stroke-width="1.5" stroke-dasharray="5 3"/>
    <polygon points="488,270 504,264 495,280" fill="#FF4444" opacity="0.6"/>
    <circle cx="468" cy="278" r="5" fill="#FF4444" opacity="0.3"/>
    <line x1="475" y1="270" x2="482" y2="258" stroke="#FF4444" stroke-width="1.5" opacity="0.5"/>
    <line x1="470" y1="270" x2="465" y2="255" stroke="#FF4444" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- BLOCKED labels -->
  <g filter="url(#glow-sm2)">
    <text x="140" y="232" fill="#FF4444" font-size="9" opacity="0.7">THREAT BLOCKED</text>
    <text x="620" y="232" fill="#FF4444" font-size="9" opacity="0.7" text-anchor="end">THREAT BLOCKED</text>
  </g>

  <!-- Bottom message -->
  <rect x="0" y="560" width="800" height="40" fill="#0B0F1A" opacity="0.9"/>
  <rect x="0" y="560" width="800" height="1.5" fill="#6C5CE7" opacity="0.6"/>
  <text x="400" y="580" fill="#E6F1FF" font-size="11" text-anchor="middle" opacity="0.8">Pixel Shield bloque les menaces — Protection avancée en temps réel</text>

  <!-- Title top -->
  <rect x="0" y="0" width="800" height="58" fill="#0B0F1A" opacity="0.75"/>
  <rect x="0" y="57" width="800" height="1.5" fill="#6C5CE7" opacity="0.5"/>
  <text x="400" y="30" fill="#E6F1FF" font-size="24" text-anchor="middle" font-weight="bold" filter="url(#glow-v)">◈ BOUCLIER NUMÉRIQUE</text>
  <text x="400" y="50" fill="#6C5CE7" font-size="10" text-anchor="middle" opacity="0.8">PIXEL SHIELD™ — PROTECTION ACTIVE  ·  ALL THREATS NEUTRALIZED</text>

  <!-- Corner marks -->
  <g stroke="#6C5CE7" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M10,10 L10,26 M10,10 L26,10"/><path d="M790,10 L790,26 M790,10 L774,10"/>
    <path d="M10,590 L10,574 M10,590 L26,590"/><path d="M790,590 L790,574 M790,590 L774,590"/>
  </g>
</svg>
