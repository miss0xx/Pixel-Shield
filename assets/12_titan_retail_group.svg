<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" width="400" height="200">
  <defs>
    <linearGradient id="titanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#0d1320"/>
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#C2500A"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A3040"/>
      <stop offset="100%" style="stop-color:#1a2030"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" fill="url(#titanBg)" rx="4"/>

  <!-- Massive T symbol -->
  <!-- Horizontal bar (thick) -->
  <rect x="140" y="30" width="90" height="18" rx="3" fill="url(#tGrad)"/>
  <!-- Vertical bar -->
  <rect x="176" y="30" width="18" height="80" rx="3" fill="url(#tGrad)"/>

  <!-- Stacked blocks behind T (depth/stability effect) -->
  <rect x="144" y="34" width="82" height="14" rx="2" fill="#F97316" opacity="0.15" transform="translate(4, 4)"/>
  <rect x="148" y="38" width="74" height="10" rx="2" fill="#F97316" opacity="0.08" transform="translate(8, 8)"/>

  <!-- Bottom accent bar -->
  <rect x="140" y="115" width="90" height="4" rx="2" fill="#F97316" opacity="0.4"/>

  <!-- Small squares motif (right side) -->
  <rect x="238" y="48" width="8" height="8" rx="1" fill="#F97316" opacity="0.6"/>
  <rect x="250" y="48" width="8" height="8" rx="1" fill="#F97316" opacity="0.3"/>
  <rect x="238" y="60" width="8" height="8" rx="1" fill="#F97316" opacity="0.3"/>
  <rect x="250" y="60" width="8" height="8" rx="1" fill="#E5E7EB" opacity="0.1"/>

  <!-- Brand name -->
  <text x="200" y="148" font-family="'Bebas Neue', 'Anton', 'Impact', 'Arial Black', sans-serif"
        font-size="24" font-weight="900" fill="#E5E7EB" text-anchor="middle" letter-spacing="6">TITAN</text>
  <text x="200" y="166" font-family="'Bebas Neue', 'Anton', 'Impact', sans-serif"
        font-size="9" font-weight="400" fill="#F97316" text-anchor="middle" letter-spacing="6">RETAIL GROUP</text>
</svg>
