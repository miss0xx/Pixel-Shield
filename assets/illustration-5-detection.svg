<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="50%" r="68%">
      <stop offset="0%" stop-color="#0E1530"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </radialGradient>
    <radialGradient id="scan-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="threat-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2222" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF2222" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow5" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow5-sm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow5-red" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes scan5 { 0%{transform:translateY(0px);opacity:1} 85%{opacity:1} 100%{transform:translateY(280px);opacity:0} }
      @keyframes pulse5r { 0%,100%{opacity:.2} 50%{opacity:.5} }
      @keyframes pulse5b { 0%,100%{opacity:.15} 50%{opacity:.4} }
      @keyframes rotate5 { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes blink5 { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes intercept { 0%,100%{transform:scale(1);opacity:.8} 50%{transform:scale(1.08);opacity:1} }
      @keyframes threat-pulse { 0%,100%{stroke-width:1.5;opacity:.6} 50%{stroke-width:3;opacity:1} }
      @keyframes slide-in { from{transform:translateX(60px);opacity:0} to{transform:translateX(0);opacity:1} }
      .scan-line { animation: scan5 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center top; }
      .pr5 { animation: pulse5r 1.5s ease-in-out infinite; }
      .pb5 { animation: pulse5b 2s ease-in-out infinite; }
      .rot5 { animation: rotate5 8s linear infinite; transform-origin: 580px 300px; }
      .rot5b { animation: rotate5 14s linear infinite reverse; transform-origin: 580px 300px; }
      .blink5 { animation: blink5 0.8s step-end infinite; }
      .intercept { animation: intercept 1.5s ease-in-out infinite; transform-origin: 580px 300px; }
      .threat { animation: threat-pulse 1.2s ease-in-out infinite; }
      .alert-slide { animation: slide-in 0.5s ease forwards; }
    </style>
    <linearGradient id="scan-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00D4FF" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="monitor-grad5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141C38"/>
      <stop offset="100%" stop-color="#0D1228"/>
    </linearGradient>
    <linearGradient id="screen-grad5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0F22"/>
      <stop offset="100%" stop-color="#070C1A"/>
    </linearGradient>
    <clipPath id="screen5-clip">
      <rect x="165" y="138" width="370" height="270" rx="3"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg5)"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#00D4FF" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/><line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="525" x2="800" y2="525"/>
    <line x1="80" y1="0" x2="80" y2="600"/><line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="240" y1="0" x2="240" y2="600"/><line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/><line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="560" y1="0" x2="560" y2="600"/><line x1="640" y1="0" x2="640" y2="600"/>
    <line x1="720" y1="0" x2="720" y2="600"/>
  </g>

  <!-- === LEFT: MONITOR WITH SCAN === -->
  <!-- Monitor body -->
  <rect x="148" y="128" width="404" height="288" rx="12" fill="url(#monitor-grad5)" stroke="#1E2848" stroke-width="2"/>
  <rect x="158" y="136" width="384" height="272" rx="7" fill="#080C18" stroke="#141C38" stroke-width="1.5"/>

  <!-- Screen -->
  <rect x="165" y="138" width="370" height="270" rx="3" fill="url(#screen-grad5)"/>

  <!-- Screen content (clipped) -->
  <g clip-path="url(#screen5-clip)">
    <!-- Normal code background -->
    <g fill="#1E3050" font-size="8.5" opacity="0.5">
      <text x="175" y="158">import security_module as sec</text>
      <text x="175" y="170">import network_monitor as net</text>
      <text x="175" y="182">from pixel_shield import Scanner, Firewall</text>
      <text x="175" y="194"> </text>
      <text x="175" y="206">scanner = Scanner(mode='realtime', depth='deep')</text>
      <text x="175" y="218">firewall = Firewall(policy='strict', ips=True)</text>
      <text x="175" y="230"> </text>
      <text x="175" y="242">def protect_system():</text>
      <text x="175" y="254">    threats = scanner.scan_all_processes()</text>
      <text x="175" y="266">    for threat in threats:</text>
      <text x="175" y="278">        firewall.block(threat)</text>
      <text x="175" y="290">        log.alert(threat.signature)</text>
      <text x="175" y="302"> </text>
      <text x="175" y="314">    net.monitor_traffic(realtime=True)</text>
      <text x="175" y="326">    backup.encrypt_and_save()</text>
      <text x="175" y="338"> </text>
      <text x="175" y="350">scan_result = protect_system()</text>
      <text x="175" y="362"># Status: MONITORING...</text>
      <text x="175" y="374"># Files scanned: 28,741 / 28,741</text>
      <text x="175" y="386"># Threats found: 1 — INTERCEPTING...</text>
      <text x="175" y="398"># Protection: ACTIVE</text>
    </g>

    <!-- INFECTED FILE HIGHLIGHT BOX -->
    <rect x="172" y="346" width="355" height="50" rx="3" fill="#FF0010" opacity="0.12" class="pr5"/>
    <rect x="172" y="346" width="355" height="50" rx="3" fill="none" stroke="#FF2222" stroke-width="1.5" class="threat"/>
    <!-- Arrows pointing to threat line -->
    <polygon points="165,368 175,362 175,374" fill="#FF2222" opacity="0.8"/>
    <!-- Infected file path text -->
    <text x="180" y="360" fill="#FF4444" font-size="8.5" font-weight="bold">⚠ THREAT DETECTED: Ransomware.Ryuk.Gen</text>
    <text x="180" y="374" fill="#FF6666" font-size="8">   PATH: C:\Windows\System32\svchost_fake.exe</text>
    <text x="180" y="386" fill="#FF4444" font-size="8">   ACTION: INTERCEPTING &amp; QUARANTINING...</text>

    <!-- Scan beam (animated horizontal line sweeping down) -->
    <rect class="scan-line" x="165" y="138" width="370" height="28" fill="url(#scan-beam)" opacity="0.85"/>
    <!-- Scan line (the bright line itself) -->
    <rect class="scan-line" x="165" y="160" width="370" height="2" fill="#00D4FF" opacity="0.9" filter="url(#glow5-sm)"/>

    <!-- Blue scan tint overlay -->
    <rect x="165" y="138" width="370" height="270" fill="#00D4FF" opacity="0.03"/>
  </g>

  <!-- Monitor stand -->
  <rect x="342" y="416" width="16" height="20" rx="2" fill="#0D1228"/>
  <rect x="316" y="434" width="68" height="10" rx="5" fill="#0D1228" stroke="#141C38" stroke-width="1"/>

  <!-- Scanbar glow on screen -->
  <rect x="165" y="138" width="370" height="270" rx="3" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.2"/>

  <!-- === TOP LEFT: SCAN PROGRESS === -->
  <rect x="148" y="78" width="200" height="42" rx="6" fill="#0E1428" stroke="#1E2848" stroke-width="1.2"/>
  <text x="160" y="95" fill="#00D4FF" font-size="9" opacity="0.9" font-weight="bold">▶ ANALYSE EN COURS</text>
  <rect x="160" y="100" width="174" height="7" rx="3" fill="#1E2848"/>
  <rect x="160" y="100" width="158" height="7" rx="3" fill="#00D4FF" opacity="0.8"/>
  <text x="338" y="107" fill="#E6F1FF" font-size="7" opacity="0.7" text-anchor="end">91%</text>
  <text x="160" y="117" fill="#E6F1FF" font-size="7.5" opacity="0.5">28,741 fichiers analysés  ·  temps: 00:04:12</text>

  <!-- === TOP CENTER: STATUS BAR === -->
  <rect x="362" y="78" width="188" height="42" rx="6" fill="#0E1428" stroke="#1E2848" stroke-width="1.2"/>
  <circle cx="376" cy="90" r="5" fill="#00D4FF" filter="url(#glow5-sm)" class="pb5"/>
  <text x="388" y="94" fill="#00D4FF" font-size="9" font-weight="bold">DÉTECTION TEMPS RÉEL</text>
  <text x="388" y="106" fill="#E6F1FF" font-size="8" opacity="0.6">Mode: Protection active avancée</text>
  <text x="388" y="116" fill="#6C5CE7" font-size="8" opacity="0.7">Signatures: 4,821,047 à jour</text>

  <!-- === RIGHT PANEL: SHIELD INTERCEPTING === -->
  <!-- Threat source -->
  <g filter="url(#glow5-red)">
    <rect x="586" y="148" width="50" height="60" rx="5" fill="#1A0008" stroke="#CC1111" stroke-width="1.5"/>
    <path d="M611,148 L636,173 L611,173 Z" fill="#2a0010" stroke="#CC1111" stroke-width="1"/>
    <line x1="594" y1="182" x2="628" y2="182" stroke="#FF3333" stroke-width="1.2" opacity="0.7"/>
    <line x1="594" y1="189" x2="620" y2="189" stroke="#FF3333" stroke-width="1" opacity="0.5"/>
    <line x1="594" y1="196" x2="624" y2="196" stroke="#FF3333" stroke-width="1" opacity="0.4"/>
    <text x="611" y="224" fill="#FF4444" font-size="8" text-anchor="middle">MALWARE</text>
    <!-- Skull mini -->
    <ellipse cx="611" cy="162" rx="10" ry="9" fill="none" stroke="#FF2222" stroke-width="1.2"/>
    <ellipse cx="607" cy="160" rx="2.5" ry="3" fill="#FF2222" opacity="0.7"/>
    <ellipse cx="615" cy="160" rx="2.5" ry="3" fill="#FF2222" opacity="0.7"/>
  </g>

  <!-- Threat trajectory arrow -->
  <path d="M580,200 Q555,255 540,280" fill="none" stroke="#FF2222" stroke-width="2"
        stroke-dasharray="6 4" opacity="0.7" marker-end="url(#arrow-red)"/>
  <defs>
    <marker id="arrow-red" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 Z" fill="#FF2222"/>
    </marker>
    <marker id="arrow-blue" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 Z" fill="#00D4FF"/>
    </marker>
  </defs>

  <!-- SHIELD INTERCEPTING -->
  <g class="intercept" filter="url(#glow5)">
    <!-- Rotating outer rings -->
    <circle cx="580" cy="300" r="62" fill="none" stroke="#6C5CE7" stroke-width="1" stroke-dasharray="6 8" opacity="0.5" class="rot5"/>
    <circle cx="580" cy="300" r="72" fill="none" stroke="#00D4FF" stroke-width="0.8" stroke-dasharray="4 12" opacity="0.4" class="rot5b"/>
    <!-- Shield shape -->
    <path d="M580,258 L614,272 L614,308 Q614,334 580,348 Q546,334 546,308 L546,272 Z"
          fill="#6C5CE7" opacity="0.4" stroke="#6C5CE7" stroke-width="2.5"/>
    <path d="M580,265 L608,277 L608,307 Q608,330 580,342 Q552,330 552,307 L552,277 Z"
          fill="none" stroke="#00D4FF" stroke-width="1.2" opacity="0.7"/>
    <!-- Shield core glow -->
    <circle cx="580" cy="303" r="28" fill="#00D4FF" opacity="0.08"/>
    <!-- INTERCEPT symbol - X blocking threat -->
    <line x1="566" y1="290" x2="594" y2="318" stroke="#E6F1FF" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="594" y1="290" x2="566" y2="318" stroke="#E6F1FF" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Impact sparks -->
    <circle cx="546" cy="284" r="4" fill="#FF4444" opacity="0.6"/>
    <line x1="540" y1="278" x2="533" y2="270" stroke="#FF4444" stroke-width="1.5" opacity="0.7"/>
    <line x1="542" y1="275" x2="538" y2="265" stroke="#FF4444" stroke-width="1.5" opacity="0.6"/>
    <line x1="535" y1="282" x2="525" y2="280" stroke="#FF4444" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Deflected path -->
  <path d="M542,284 Q510,320 502,380" fill="none" stroke="#FF4444" stroke-width="1.5"
        stroke-dasharray="5 4" opacity="0.5" marker-end="url(#arrow-red)"/>

  <!-- BLOCKED label -->
  <rect x="540" y="350" width="80" height="20" rx="4" fill="#001A00" stroke="#00CC44" stroke-width="1.2" filter="url(#glow5-sm)"/>
  <text x="580" y="364" fill="#00CC44" font-size="10" text-anchor="middle" font-weight="bold">✓ BLOQUÉ</text>

  <!-- === ALERT NOTIFICATION === -->
  <rect x="570" y="410" width="200" height="130" rx="8" fill="#0E1428" stroke="#FF2222" stroke-width="1.8"
        class="alert-slide" filter="url(#glow5-red)"/>
  <!-- Alert header -->
  <rect x="570" y="410" width="200" height="28" rx="8" fill="#1A0008"/>
  <rect x="570" y="424" width="200" height="14" fill="#1A0008"/>
  <circle cx="584" cy="424" r="6" fill="#FF2222" opacity="0.9"/>
  <text x="595" y="428" fill="#FF4444" font-size="10" font-weight="bold">⚠ ALERTE CRITIQUE</text>
  <text x="756" y="422" fill="#E6F1FF" font-size="9" text-anchor="end" opacity="0.5">14:32:07</text>
  <!-- Alert body -->
  <line x1="577" y1="442" x2="763" y2="442" stroke="#2A0010" stroke-width="1"/>
  <text x="580" y="457" fill="#FF6666" font-size="8.5">Menace interceptée:</text>
  <text x="580" y="470" fill="#E6F1FF" font-size="8" opacity="0.9">Ransomware.Ryuk.Gen</text>
  <text x="580" y="482" fill="#E6F1FF" font-size="8" opacity="0.7">C:\System32\svchost_fake.exe</text>
  <text x="580" y="494" fill="#FFAA00" font-size="8">Statut: Mise en quarantaine</text>
  <!-- Action buttons -->
  <rect x="580" y="500" width="80" height="18" rx="4" fill="#00441A" stroke="#00CC44" stroke-width="1"/>
  <text x="620" y="513" fill="#00CC44" font-size="8" text-anchor="middle">QUARANTAINE ✓</text>
  <rect x="668" y="500" width="90" height="18" rx="4" fill="#1E2848" stroke="#6C5CE7" stroke-width="1"/>
  <text x="713" y="513" fill="#6C5CE7" font-size="8" text-anchor="middle">VOIR RAPPORT</text>

  <!-- Bottom message -->
  <rect x="0" y="560" width="800" height="40" fill="#0B0F1A" opacity="0.9"/>
  <rect x="0" y="560" width="800" height="1.5" fill="#00D4FF" opacity="0.5"/>
  <text x="400" y="580" fill="#E6F1FF" font-size="11" text-anchor="middle" opacity="0.8">Détection &amp; neutralisation en temps réel — Pixel Shield en action</text>

  <!-- Title -->
  <rect x="0" y="0" width="800" height="72" fill="#0B0F1A" opacity="0.75"/>
  <rect x="0" y="71" width="800" height="1.5" fill="#00D4FF" opacity="0.45"/>
  <text x="400" y="34" fill="#E6F1FF" font-size="22" text-anchor="middle" font-weight="bold" filter="url(#glow5)">◈ DÉTECTION EN TEMPS RÉEL</text>
  <text x="400" y="54" fill="#00D4FF" font-size="10" text-anchor="middle" opacity="0.8">ALERTE ACTIVE — MENACE INTERCEPTÉE &amp; NEUTRALISÉE EN 0.3ms</text>
  <text x="400" y="67" fill="#6C5CE7" font-size="9" text-anchor="middle" opacity="0.6">PIXEL SHIELD™ — REAL-TIME THREAT INTERCEPTION SYSTEM</text>

  <!-- Corner marks -->
  <g stroke="#00D4FF" stroke-width="1.5" fill="none" opacity="0.35">
    <path d="M10,10 L10,26 M10,10 L26,10"/><path d="M790,10 L790,26 M790,10 L774,10"/>
    <path d="M10,590 L10,574 M10,590 L26,590"/><path d="M790,590 L790,574 M790,590 L774,590"/>
  </g>
</svg>
