<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" width="400" height="200">
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FDE68A"/>
      <stop offset="60%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:0.6"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ADE80"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" fill="#0F172A" rx="4"/>

  <!-- Sun rays -->
  <g opacity="0.5" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round">
    <line x1="185" y1="18" x2="185" y2="30"/>
    <line x1="185" y1="120" x2="185" y2="132"/>
    <line x1="133" y1="75" x2="121" y2="75"/>
    <line x1="237" y1="75" x2="249" y2="75"/>
    <line x1="148" y1="38" x2="156" y2="46"/>
    <line x1="214" y1="38" x2="222" y2="46"/>
    <line x1="148" y1="112" x2="156" y2="104"/>
    <line x1="214" y1="112" x2="222" y2="104"/>
  </g>

  <!-- Sun core -->
  <circle cx="185" cy="75" r="32" fill="url(#sunGrad)"/>

  <!-- Leaf shape overlaid on sun (bottom-right quadrant) -->
  <path d="M185 75 C185 75 208 60 214 85 C208 100 185 95 185 75Z" fill="url(#leafGrad)" opacity="0.9"/>
  <!-- Leaf vein -->
  <path d="M185 78 C190 82 204 84 212 85" fill="none" stroke="#16A34A" stroke-width="1" opacity="0.7"/>

  <!-- Glow effect -->
  <circle cx="185" cy="75" r="40" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.15"/>

  <!-- Brand name -->
  <text x="200" y="148" font-family="'Josefin Sans', 'Raleway', 'Century Gothic', sans-serif"
        font-size="20" font-weight="600" fill="#F8FAFC" text-anchor="middle" letter-spacing="4">SOLSTICE</text>
  <!-- Tagline -->
  <text x="200" y="166" font-family="'Josefin Sans', 'Raleway', 'Century Gothic', sans-serif"
        font-size="9.5" font-weight="300" fill="#22C55E" text-anchor="middle" letter-spacing="7">ENERGY</text>
</svg>
