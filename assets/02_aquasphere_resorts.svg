<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" width="400" height="200">
  <defs>
    <radialGradient id="sphereGrad" cx="45%" cy="38%" r="55%">
      <stop offset="0%" style="stop-color:#90E0EF;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#00B4D8;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0A1B2A;stop-opacity:0.6"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00B4D8"/>
      <stop offset="100%" style="stop-color:#90E0EF"/>
    </linearGradient>
    <clipPath id="sphereClip">
      <circle cx="185" cy="78" r="42"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" fill="#0A1B2A" rx="4"/>
  <!-- Subtle glow behind sphere -->
  <circle cx="185" cy="78" r="58" fill="#00B4D8" opacity="0.07"/>
  <circle cx="185" cy="78" r="48" fill="#00B4D8" opacity="0.08"/>

  <!-- Main sphere -->
  <circle cx="185" cy="78" r="42" fill="url(#sphereGrad)" stroke="#00B4D8" stroke-width="1" opacity="0.9"/>

  <!-- Wave lines inside sphere -->
  <g clip-path="url(#sphereClip)" opacity="0.6">
    <path d="M143 72 Q157 62 171 72 Q185 82 199 72 Q213 62 227 72" fill="none" stroke="#90E0EF" stroke-width="1.5"/>
    <path d="M143 82 Q157 72 171 82 Q185 92 199 82 Q213 72 227 82" fill="none" stroke="#90E0EF" stroke-width="1.5"/>
    <path d="M143 92 Q157 82 171 92 Q185 102 199 92 Q213 82 227 92" fill="none" stroke="#90E0EF" stroke-width="1.2"/>
  </g>
  <!-- Sphere highlight -->
  <ellipse cx="172" cy="60" rx="14" ry="8" fill="white" opacity="0.15"/>

  <!-- Brand name -->
  <text x="200" y="146" font-family="'Gill Sans', 'Trebuchet MS', sans-serif"
        font-size="19" font-weight="600" fill="#F0FBFE" text-anchor="middle" letter-spacing="5">AQUASPHERE</text>
  <!-- Subtitle -->
  <text x="200" y="163" font-family="'Gill Sans', 'Trebuchet MS', sans-serif"
        font-size="9" font-weight="300" fill="#00B4D8" text-anchor="middle" letter-spacing="5">RESORTS</text>
</svg>
