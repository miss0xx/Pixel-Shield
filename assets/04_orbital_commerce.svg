<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" width="400" height="200">
  <defs>
    <radialGradient id="globeGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#3a2f8f"/>
      <stop offset="60%" style="stop-color:#6C5CE7;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#12182B"/>
    </radialGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#6C5CE7;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#6C5CE7"/>
      <stop offset="100%" style="stop-color:#6C5CE7;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" fill="#12182B" rx="4"/>

  <!-- Star field -->
  <circle cx="30" cy="20" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="80" cy="45" r="0.6" fill="white" opacity="0.4"/>
  <circle cx="340" cy="30" r="1" fill="white" opacity="0.5"/>
  <circle cx="370" cy="60" r="0.6" fill="white" opacity="0.3"/>
  <circle cx="50" cy="160" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="360" cy="155" r="0.6" fill="white" opacity="0.4"/>
  <circle cx="310" cy="170" r="0.8" fill="white" opacity="0.3"/>

  <!-- Outer orbit ellipse -->
  <ellipse cx="185" cy="75" rx="68" ry="22" fill="none" stroke="url(#orbitGrad1)" stroke-width="1.2" opacity="0.7"/>
  <!-- Tilted orbit ellipse -->
  <ellipse cx="185" cy="75" rx="55" ry="62" fill="none" stroke="url(#orbitGrad2)" stroke-width="1" opacity="0.5" transform="rotate(-30 185 75)"/>

  <!-- Globe core -->
  <circle cx="185" cy="75" r="32" fill="url(#globeGrad)"/>
  <!-- Globe meridian lines -->
  <ellipse cx="185" cy="75" rx="16" ry="32" fill="none" stroke="#00D4FF" stroke-width="0.7" opacity="0.35"/>
  <ellipse cx="185" cy="75" rx="32" ry="32" fill="none" stroke="#00D4FF" stroke-width="0.7" opacity="0.2"/>
  <line x1="153" y1="75" x2="217" y2="75" stroke="#00D4FF" stroke-width="0.7" opacity="0.4"/>

  <!-- Moving dot on orbit -->
  <circle cx="253" cy="75" r="3.5" fill="#00D4FF"/>
  <circle cx="253" cy="75" r="6" fill="#00D4FF" opacity="0.2"/>

  <!-- Brand name -->
  <text x="200" y="147" font-family="'Rajdhani', 'Exo', 'Orbitron', 'Courier New', monospace"
        font-size="18" font-weight="700" fill="#F0F4FF" text-anchor="middle" letter-spacing="5">ORBITAL</text>
  <text x="200" y="166" font-family="'Rajdhani', 'Exo', 'Orbitron', 'Courier New', monospace"
        font-size="10" font-weight="400" fill="#6C5CE7" text-anchor="middle" letter-spacing="8">COMMERCE</text>
</svg>
