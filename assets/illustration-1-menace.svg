    <polygon points="95,330 130,268 165,330" fill="none" stroke="#FF5500" stroke-width="2" opacity="0.8"/>
    <text x="130" y="320" fill="#FF5500" font-size="30" text-anchor="middle" font-weight="bold">!</text>
    <polygon points="635,330 670,268 705,330" fill="none" stroke="#FF5500" stroke-width="2" opacity="0.8"/>
    <text x="670" y="320" fill="#FF5500" font-size="30" text-anchor="middle" font-weight="bold">!</text>
  </g>

  <!-- Alert bar bottom -->
  <rect x="0" y="492" width="800" height="58" fill="#150008" opacity="0.95"/>
  <rect x="0" y="492" width="800" height="2.5" fill="#FF1122"/>
  <rect x="0" y="547.5" width="800" height="2" fill="#FF1122" opacity="0.4"/>
  <!-- Alert icons -->
