  <text x="52" y="516" fill="#0B0F1A" font-size="15" text-anchor="middle" font-weight="bold">!</text>
  <polygon points="732,520 748,495 764,520" fill="#FF4400"/>
  <text x="748" y="516" fill="#0B0F1A" font-size="15" text-anchor="middle" font-weight="bold">!</text>
  <!-- Alert texts -->
