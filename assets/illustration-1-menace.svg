<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#200008"/>
      <stop offset="100%" stop-color="#0B0F1A"/>
    </radialGradient>
    <radialGradient id="danger-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF0030" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF0030" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-red" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes pulse-danger { 0%,100%{opacity:.15} 50%{opacity:.35} }
      @keyframes flicker { 0%,100%{opacity:1} 48%{opacity:.85} 50%{opacity:.6} 52%{opacity:.9} 70%{opacity:1} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes scan { 0%{transform:translateY(-220px)} 100%{transform:translateY(240px)} }
      .pulse-d { animation: pulse-danger 1.8s ease-in-out infinite; }
      .flicker { animation: flicker 3s infinite; }
      .blink { animation: blink 1s step-end infinite; }
      .scanline { animation: scan 4s linear infinite; }
    </style>
    <linearGradient id="screen-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0005"/>
      <stop offset="100%" stop-color="#0d0008"/>
    </linearGradient>
    <linearGradient id="monitor-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a12"/>
      <stop offset="100%" stop-color="#0f0810"/>
    </linearGradient>
    <clipPath id="screen-clip">
      <rect x="238" y="168" width="324" height="222" rx="3"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#danger-glow)" class="pulse-d"/>

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#FF2222" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/><line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="525" x2="800" y2="525"/>
    <line x1="80" y1="0" x2="80" y2="600"/><line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="240" y1="0" x2="240" y2="600"/><line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/><line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="560" y1="0" x2="560" y2="600"/><line x1="640" y1="0" x2="640" y2="600"/>
    <line x1="720" y1="0" x2="720" y2="600"/>
  </g>

  <!-- Floating binary fragments -->
  <g fill="#FF3333" font-size="9" opacity="0.25">
    <text x="20" y="80">10110010</text><text x="20" y="96">01001101</text><text x="20" y="112">11010010</text>
    <text x="20" y="128">00101101</text><text x="20" y="144">10110010</text>
    <text x="700" y="80">01101001</text><text x="700" y="96">11001011</text><text x="700" y="112">00110100</text>
    <text x="700" y="128">10011010</text><text x="700" y="144">01100101</text>
    <text x="55" y="430">0xDEAD</text><text x="55" y="446">0xBEEF</text><text x="55" y="462">0xF4T4L</text>
    <text x="690" y="430">0x4141</text><text x="690" y="446">0xC0DE</text><text x="690" y="462">0xB4D0</text>
  </g>

  <!-- Monitor body -->
  <rect x="218" y="158" width="364" height="256" rx="12" fill="url(#monitor-grad)" stroke="#3D0015" stroke-width="2.5"/>
  <rect x="230" y="166" width="340" height="238" rx="6" fill="#080004" stroke="#2a0010" stroke-width="1.5"/>

  <!-- Screen -->
  <rect x="238" y="168" width="324" height="222" rx="3" fill="url(#screen-grad)"/>

  <!-- Screen content - corrupted code -->
  <g clip-path="url(#screen-clip)">
    <g fill="#CC1111" font-size="8.5" opacity="0.85">
      <text x="248" y="186">&#x25BA; MALWARE_EXEC: payload_x91.dll --inject --stealth</text>
      <text x="248" y="199">  [!!] CRITICAL: Memory overflow at 0xFFFF4400</text>
      <text x="248" y="212">&#x25BA; KEYLOGGER ACTIVE — capturing keystrokes...</text>
      <text x="248" y="225">  [!!] RANSOMWARE: Encrypting /documents/ ████ 73%</text>
      <text x="248" y="238">&#x25BA; BACKDOOR_OPEN: port 4444 — C&amp;C connected</text>
      <text x="248" y="251">  [!!] CREDENTIAL DUMP: SUCCESS — 847 passwords</text>
      <text x="248" y="264">&#x25BA; ROOTKIT: hiding 12 processes from OS...</text>
      <text x="248" y="277">  [!!] DATA EXFIL: uploading 4.2GB to remote...</text>
      <text x="248" y="290">&#x25BA; SPREADING: scanning 192.168.1.0/24 network</text>
      <text x="248" y="303">  [!!] FILE_SYSTEM: 2,847 files ENCRYPTED ✗</text>
      <text x="248" y="316">&#x25BA; PERSISTENCE: registry modified — autostart ON</text>
      <text x="248" y="329">  [!!] CRITICAL SYSTEM FAILURE IN: 00:03:47</text>
      <text x="248" y="344" fill="#FF4444" font-weight="bold">  ███ ALL YOUR DATA IS OWNED ███</text>
      <text x="248" y="360" fill="#FF2222">  ██████████████████████████ 91%</text>
      <text x="248" y="376" fill="#FF0000">  TOTAL SYSTEM COMPROMISE<tspan class="blink">_</tspan></text>
    </g>
    <!-- Scanline effect -->
