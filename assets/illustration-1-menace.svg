  <text x="400" y="535" fill="#FF6677" font-size="11" text-anchor="middle">Voilà ce qui arrive sans protection</text>

  <!-- Title area top -->
  <rect x="0" y="0" width="800" height="60" fill="#0B0F1A" opacity="0.7"/>
  <rect x="0" y="58" width="800" height="1.5" fill="#FF1122" opacity="0.5"/>
  <text x="400" y="32" fill="#FF2233" font-size="24" text-anchor="middle" font-weight="bold" filter="url(#glow-red)">◈ MENACE DÉTECTÉE</text>
  <text x="400" y="51" fill="#FF5566" font-size="10" text-anchor="middle" opacity="0.75">THREAT_ID: 0xF4T4L_3RR0R  ·  SEVERITY: CRITICAL  ·  STATUS: UNPROTECTED</text>

  <!-- Corner markers -->
  <g stroke="#FF2222" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M10,10 L10,28 M10,10 L28,10"/>
    <path d="M790,10 L790,28 M790,10 L772,10"/>
    <path d="M10,590 L10,572 M10,590 L28,590"/>
    <path d="M790,590 L790,572 M790,590 L772,590"/>
  </g>
  <text x="400" y="589" fill="#E6F1FF" font-size="8" text-anchor="middle" opacity="0.2">PIXEL SHIELD™ — SANS PROTECTION</text>
</svg>
