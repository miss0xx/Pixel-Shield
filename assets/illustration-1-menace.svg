    <ellipse cx="0" cy="-18" rx="38" ry="34" fill="none" stroke="#FF1111" stroke-width="2"/>
    <ellipse cx="-14" cy="-24" rx="9" ry="10" fill="#FF1111" opacity="0.7"/>
    <ellipse cx="14" cy="-24" rx="9" ry="10" fill="#FF1111" opacity="0.7"/>
    <path d="M-5,-3 L0,-10 L5,-3 Z" fill="#FF2222" opacity="0.6"/>
    <rect x="-20" y="6" width="9" height="11" rx="2" fill="#FF2222" opacity="0.7"/>
    <rect x="-9" y="6" width="9" height="13" rx="2" fill="#FF2222" opacity="0.7"/>
    <rect x="2" y="6" width="9" height="13" rx="2" fill="#FF2222" opacity="0.7"/>
    <rect x="13" y="6" width="9" height="11" rx="2" fill="#FF2222" opacity="0.7"/>
    <path d="M-20,6 L-22,24 L22,24 L20,6" fill="none" stroke="#FF2222" stroke-width="2"/>
