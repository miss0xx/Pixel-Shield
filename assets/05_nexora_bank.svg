<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" width="400" height="200">
  <defs>
    <linearGradient id="nxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2A44"/>
      <stop offset="100%" style="stop-color:#0B0F1A"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" fill="url(#nxGrad)" rx="4"/>

  <!-- Subtle diagonal grid lines -->
  <g opacity="0.04" stroke="#00D4FF" stroke-width="0.5">
    <line x1="0" y1="0" x2="200" y2="200"/>
    <line x1="50" y1="0" x2="250" y2="200"/>
    <line x1="100" y1="0" x2="300" y2="200"/>
    <line x1="150" y1="0" x2="350" y2="200"/>
    <line x1="200" y1="0" x2="400" y2="200"/>
    <line x1="250" y1="0" x2="450" y2="200"/>
  </g>

  <!-- N symbol: bold architectural N -->
  <!-- Left vertical bar -->
  <rect x="148" y="32" width="12" height="72" rx="2" fill="#F0F8FF"/>
  <!-- Diagonal -->
  <polygon points="148,32 160,32 220,96 220,104 208,104" fill="#F0F8FF"/>
  <!-- Right vertical bar -->
  <rect x="208" y="32" width="12" height="72" rx="2" fill="#F0F8FF"/>

  <!-- Digital flow line beneath -->
  <path d="M130 116 Q160 108 185 116 Q210 124 240 116 Q260 110 270 116" 
        fill="none" stroke="url(#flowGrad)" stroke-width="1.5" opacity="0.9"/>

  <!-- Glowing dots on flow -->
  <circle cx="185" cy="116" r="2.5" fill="#00D4FF"/>
  <circle cx="185" cy="116" r="5" fill="#00D4FF" opacity="0.2"/>

  <!-- Brand name -->
  <text x="200" y="150" font-family="'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif"
        font-size="21" font-weight="700" fill="#F5F9FF" text-anchor="middle" letter-spacing="6">NEXORA</text>
  <!-- Tagline -->
  <text x="200" y="168" font-family="'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif"
        font-size="8.5" font-weight="300" fill="#00D4FF" text-anchor="middle" letter-spacing="7">BANK</text>
</svg>
