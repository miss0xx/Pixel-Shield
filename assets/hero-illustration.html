<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-violet: #6C5CE7;
            --accent-cyan: #00D4FF;
            --light-blue: #E6F1FF;
            --dark-bg: #12182B;
            --darker-bg: #0B0F1A;
            --glow-blur: 8px;
        }
        
        body {
            background: linear-gradient(135deg, var(--darker-bg) 0%, #1a1f38 100%);
            overflow: hidden;
            font-family: 'Rajdhani', monospace;
        }
        
        .container {
            position: relative;
            width: 100%;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 1px rgba(0, 212, 255, 0.1));
        }
        
        .text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
            max-width: 90%;
        }
        
        .hero-title {
            font-family: 'Rajdhani', monospace;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, #00ffff 50%, var(--light-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            letter-spacing: 2px;
            line-height: 1.2;
            margin-bottom: 20px;
            animation: slideInDown 1s ease-out;
        }
        
        .subtitle {
            font-size: 1rem;
            color: rgba(0, 212, 255, 0.7);
            letter-spacing: 3px;
            animation: slideInUp 1s ease-out;
        }
        
        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
                filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.3));
            }
            50% {
                opacity: 1;
                filter: drop-shadow(0 0 16px rgba(0, 212, 255, 0.6));
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-15px);
            }
        }
        
        @keyframes orbit {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        .animated-shield {
            animation: float 3s ease-in-out infinite;
        }
        
        .orbiting-particles {
            animation: orbit 8s linear infinite;
        }
        
        .glow-element {
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-wrapper">
            <svg viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    <filter id="strongGlow">
                        <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0.4" />
                    </linearGradient>
                    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0.6" />
                    </linearGradient>
                    <pattern id="circuit" patternUnits="userSpaceOnUse" width="40" height="40">
                        <circle cx="20" cy="20" r="2" fill="#00D4FF" opacity="0.3"/>
                        <line x1="10" y1="20" x2="30" y2="20" stroke="#00D4FF" stroke-width="0.5" opacity="0.2"/>
                        <line x1="20" y1="10" x2="20" y2="30" stroke="#00D4FF" stroke-width="0.5" opacity="0.2"/>
                    </pattern>
                </defs>
                
                <!-- Background circuit pattern -->
                <rect width="1200" height="600" fill="url(#circuit)" opacity="0.1"/>
                
                <!-- Left side decorative circuits -->
                <g opacity="0.4">
                    <path d="M 50 200 L 150 200 L 150 300 L 250 300" stroke="#00D4FF" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <circle cx="50" cy="200" r="4" fill="#00D4FF"/>
                    <circle cx="150" cy="200" r="3" fill="#6C5CE7"/>
                    <circle cx="150" cy="300" r="3" fill="#6C5CE7"/>
                    <circle cx="250" cy="300" r="4" fill="#00D4FF"/>
                </g>
                
                <!-- Right side decorative circuits -->
                <g opacity="0.4">
                    <path d="M 1150 150 L 1050 150 L 1050 350 L 950 350" stroke="#00D4FF" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <circle cx="1150" cy="150" r="4" fill="#00D4FF"/>
                    <circle cx="1050" cy="150" r="3" fill="#6C5CE7"/>
                    <circle cx="1050" cy="350" r="3" fill="#6C5CE7"/>
                    <circle cx="950" cy="350" r="4" fill="#00D4FF"/>
                </g>
                
                <!-- Main shield - center -->
                <g class="animated-shield" transform="translate(600, 300)">
                    <!-- Shield outline -->
                    <path d="M 0 -80 L -60 -50 L -70 20 Q 0 100 0 100 Q 0 100 70 20 L 60 -50 Z" 
                          fill="url(#shieldGradient)" stroke="#00D4FF" stroke-width="2" filter="url(#strongGlow)"/>
                    
                    <!-- Shield inner details -->
                    <circle cx="0" cy="0" r="35" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.5"/>
                    <circle cx="0" cy="0" r="25" fill="none" stroke="#6C5CE7" stroke-width="1" opacity="0.6"/>
                    <circle cx="0" cy="0" r="15" fill="#6C5CE7" opacity="0.2"/>
                    
                    <!-- Lock icon in center -->
                    <rect x="-15" y="-5" width="30" height="20" rx="3" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
                    <path d="M -12 -5 Q -12 -15 0 -15 Q 12 -15 12 -5" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
                    <circle cx="0" cy="5" r="2" fill="#00D4FF"/>
                </g>
                
                <!-- Orbiting particles around shield -->
                <g class="orbiting-particles" transform="translate(600, 300)">
                    <circle cx="120" cy="0" r="3" fill="#00D4FF" filter="url(#glow)"/>
                    <circle cx="-120" cy="0" r="3" fill="#00D4FF" filter="url(#glow)"/>
                    <circle cx="0" cy="120" r="3" fill="#6C5CE7" filter="url(#glow)"/>
                    <circle cx="0" cy="-120" r="3" fill="#6C5CE7" filter="url(#glow)"/>
                    <circle cx="85" cy="85" r="2" fill="#00D4FF" filter="url(#glow)"/>
                    <circle cx="-85" cy="85" r="2" fill="#00D4FF" filter="url(#glow)"/>
                    <circle cx="-85" cy="-85" r="2" fill="#6C5CE7" filter="url(#glow)"/>
                    <circle cx="85" cy="-85" r="2" fill="#6C5CE7" filter="url(#glow)"/>
                </g>
                
                <!-- Connecting lines from shield to particles -->
                <g transform="translate(600, 300)" opacity="0.3">
                    <line x1="0" y1="0" x2="100" y2="0" stroke="#00D4FF" stroke-width="0.5" stroke-dasharray="5,5"/>
                    <line x1="0" y1="0" x2="-100" y2="0" stroke="#00D4FF" stroke-width="0.5" stroke-dasharray="5,5"/>
                    <line x1="0" y1="0" x2="0" y2="100" stroke="#6C5CE7" stroke-width="0.5" stroke-dasharray="5,5"/>
                    <line x1="0" y1="0" x2="0" y2="-100" stroke="#6C5CE7" stroke-width="0.5" stroke-dasharray="5,5"/>
                </g>
                
                <!-- Top-left accent shapes -->
                <g opacity="0.3">
                    <rect x="100" y="50" width="120" height="2" fill="#00D4FF" rx="1"/>
                    <rect x="100" y="60" width="80" height="1" fill="#6C5CE7"/>
                    <rect x="100" y="70" width="100" height="1" fill="#00D4FF"/>
                </g>
                
                <!-- Bottom-right accent shapes -->
                <g opacity="0.3">
                    <rect x="980" y="500" width="120" height="2" fill="#00D4FF" rx="1"/>
                    <rect x="1000" y="510" width="80" height="1" fill="#6C5CE7"/>
                    <rect x="990" y="520" width="100" height="1" fill="#00D4FF"/>
                </g>
                
                <!-- Data stream lines -->
                <g opacity="0.2" stroke="#00D4FF" stroke-width="1" stroke-linecap="round">
                    <path d="M 300 100 Q 450 150 600 200" fill="none" stroke-dasharray="5,5"/>
                    <path d="M 900 100 Q 750 150 600 200" fill="none" stroke-dasharray="5,5"/>
                    <path d="M 300 500 Q 450 450 600 400" fill="none" stroke-dasharray="5,5"/>
                    <path d="M 900 500 Q 750 450 600 400" fill="none" stroke-dasharray="5,5"/>
                </g>
            </svg>
        </div>
        
        <!-- Text overlay for hero content (this is where tu peux ajouter ton accroche) -->
        <div class="text-overlay">
            <!-- Cette div est prête pour recevoir ton contenu personnalisé -->
        </div>
    </div>
    
    <script>
        // Optional: Add interactive effects
        const container = document.querySelector('.container');
        
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const xPercent = (x / rect.width) * 100;
            const yPercent = (y / rect.height) * 100;
            
            // Subtle parallax effect
            const svg = document.querySelector('svg');
            svg.style.transform = `perspective(1000px) rotateX(${(yPercent - 50) * 0.02}deg) rotateY(${(xPercent - 50) * 0.02}deg)`;
        });
        
        container.addEventListener('mouseleave', () => {
            const svg = document.querySelector('svg');
            svg.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
        });
    </script>
</body>
</html>
